<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuva Playground</title>

    <!-- CodeMirror for code editor -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/material-ocean.min.css">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <span class="logo-icon">▲</span>
                <h1>Nuva Playground</h1>
            </div>
            <button id="run-btn" class="run-button">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
                Run Code
            </button>
        </header>

        <main class="split-pane">
            <div class="pane editor-pane">
                <div class="pane-header" style="display: flex; justify-content: space-between; align-items: center;">
                    <h2>main.nv</h2>
                    <select id="example-select"
                        style="padding: 4px 8px; border-radius: 4px; border: 1px solid #444; background-color: #1e1e1e; color: #ddd; font-family: inherit; cursor: pointer;">
                        <option value="" disabled selected>Load example script...</option>
                        <option value="00_test.nv">00_test.nv</option>
                        <option value="01_variables.nv">01_variables.nv</option>
                        <option value="02_arithmetic.nv">02_arithmetic.nv</option>
                        <option value="03_conditionals.nv">03_conditionals.nv</option>
                        <option value="04_while_loop.nv">04_while_loop.nv</option>
                        <option value="05_for_loop.nv">05_for_loop.nv</option>
                        <option value="06_repeat_loop.nv">06_repeat_loop.nv</option>
                        <option value="07_functions_recursion.nv">07_functions_recursion.nv</option>
                        <option value="08_io_input.nv">08_io_input.nv</option>
                        <option value="09_number_guessing_game.nv">09_number_guessing_game.nv</option>
                        <option value="10_all_features_demo.nv">10_all_features_demo.nv</option>
                    </select>
                </div>
                <textarea id="code-editor">
show("Hello from the web!");

let a = 10;
let b = 20;
show("The sum of 10 and 20 is: " + (a + b));

func fibonacci(n) {
    if (n <= 1) {
        return n;
    }
    return fibonacci(n - 1) + fibonacci(n - 2);
}

show("Fibonacci of 6 is: " + fibonacci(6));
</textarea>
                <div id="custom-input-section" class="custom-input-section" style="padding: 12px; background-color: var(--bg-panel); border-top: 1px solid var(--border-color); display: none; flex-direction: column; gap: 8px;">
                    <div style="font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1.2px;">Custom Input (stdin)</div>
                    <textarea id="custom-input" placeholder="Enter custom standard input here..." style="width: 100%; height: 80px; font-family: var(--font-mono); background-color: var(--bg-base); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 4px; padding: 8px; resize: vertical; box-sizing: border-box;"></textarea>
                </div>
            </div>

            <div class="pane output-pane">
                <div class="pane-header">
                    <h2>Terminal Output</h2>
                    <button id="clear-btn" class="icon-btn" title="Clear Terminal">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                            </path>
                        </svg>
                    </button>
                </div>
                <div class="terminal-container">
                    <pre id="output"></pre>
                </div>
            </div>
        </main>
    </div>

    <!-- CodeMirror scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="app.js"></script>
</body>
